<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0E1A14">
  <title>Ønsk deg en låt · Mohito</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css?v=5">
  <script src="/skjerm.js?v=1" defer></script>
</head>
<body class="screen">
  <main class="screen-wrap">
    <div class="screen-text">
      <p class="kicker" id="kveld">Mohito</p>
      <h1 id="title">Ønsk deg en låt!</h1>
      <p class="screen-sub" id="sub">Skann QR-koden med kameraet på mobilen</p>
      <p class="screen-host" id="host" hidden></p>
    </div>
    <div class="screen-qr" id="qrbox" hidden>
      <img id="qr" alt="QR-kode til ønskesiden">
    </div>
  </main>
  <div class="screen-tools" id="tools">
    <button type="button" id="full">Fullskjerm</button>
    <button type="button" id="print">Skriv ut</button>
  </div>
</body>
</html>
